<div class="chat-container">
  <!-- Empty state -->
  <div class="chat-empty" *ngIf="messages.length === 0 && !loading">
    <div class="empty-icon">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
      </svg>
    </div>
    <span class="assistant-badge"><span class="badge-dot"></span>AI Assistant</span>
    <h2>How can I help you?</h2>
    <p>Ask me anything about office policies, holidays, insurance, or general FAQs.</p>
    <div class="suggestions">
      <button class="suggestion" (click)="question = 'What are the office working hours?'; ask()">
        What are the office hours?
      </button>
      <button class="suggestion" (click)="question = 'How do I apply for leave?'; ask()">
        How do I apply for leave?
      </button>
      <button class="suggestion" (click)="question = 'What holidays are coming up?'; ask()">
        Upcoming holidays?
      </button>
    </div>
  </div>

  <!-- Messages -->
  <div class="chat-messages" #scrollContainer *ngIf="messages.length > 0 || loading">
    <div
      *ngFor="let msg of messages"
      class="message"
      [class.message--user]="msg.role === 'user'"
      [class.message--ai]="msg.role === 'ai'"
    >
      <div class="message-avatar" *ngIf="msg.role === 'ai'">AI</div>
      <div class="message-bubble">
        <p class="message-text">{{ msg.text }}</p>
        <figure *ngIf="msg.imageUrl" class="message-figure">
          <img
            class="message-image"
            [src]="msg.imageUrl"
            (error)="onImageError(msg)"
            alt="Related image"
          />
        </figure>
        <span class="message-time">{{ msg.timestamp | date:'shortTime' }}</span>
      </div>
      <div class="message-avatar message-avatar--user" *ngIf="msg.role === 'user'">You</div>
    </div>

    <!-- Typing indicator -->
    <div class="message message--ai" *ngIf="loading">
      <div class="message-avatar">AI</div>
      <div class="message-bubble message-bubble--typing">
        <div class="typing-dots">
          <span></span>
          <span></span>
          <span></span>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- Input bar -->
<div class="chat-input-bar">
  <div class="input-wrapper">
    <input
      #fileInput
      type="file"
      accept=".txt,.md,.pdf"
      hidden
      (change)="onFileSelected($event)"
    />
    <button
      type="button"
      class="attach-btn"
      (click)="fileInput.click()"
      [disabled]="loading || uploading"
      [class.attach-btn--busy]="uploading"
      [attr.aria-label]="'Upload a document'"
      [attr.title]="uploading ? 'Uploading...' : 'Upload a .txt, .md or .pdf document'"
    >
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"></path>
      </svg>
    </button>
    <input
      [(ngModel)]="question"
      placeholder="Type your question..."
      (keydown.enter)="ask()"
      [disabled]="loading"
      autocomplete="off"
    />
    <button
      *ngIf="speechSupported"
      type="button"
      class="mic-btn"
      (click)="toggleListening()"
      [disabled]="loading"
      [class.mic-btn--listening]="listening"
      [attr.aria-label]="listening ? 'Stop voice input' : 'Start voice input'"
      [attr.title]="listening ? 'Stop voice input' : 'Speak your question'"
    >
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path>
        <path d="M19 10v2a7 7 0 0 1-14 0v-2"></path>
        <line x1="12" y1="19" x2="12" y2="23"></line>
        <line x1="8" y1="23" x2="16" y2="23"></line>
      </svg>
    </button>
    <button
      class="send-btn"
      (click)="ask()"
      [disabled]="loading || !question.trim()"
      [class.send-btn--active]="question.trim() && !loading"
    >
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="22" y1="2" x2="11" y2="13"></line>
        <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
      </svg>
    </button>
  </div>
</div>
